# Local Milvus (standalone) stack for the fully-local claude-context path.
#
# This mirrors the "standalone Docker Compose" recipe milvus-io publishes
# at https://github.com/milvus-io/milvus/blob/master/deployments/docker/standalone/docker-compose.yml
# with two deliberate changes:
#
#   1. All three services (etcd, minio, milvus-standalone) bind to
#      127.0.0.1 only, so the lab's `no_default_egress` probe with `lsof`
#      cannot pick up an accidental LAN listener that would tip the
#      shared-instance cell in the wrong direction.
#
#   2. Volumes bind-mount into ./volumes/ under the PoC repo, so an
#      operator can inspect the on-disk index shape for the
#      `vector_store_local` and `portable_index` probes without hunting
#      through named Docker volumes. The .gitignore drops ./volumes/
#      so this state cannot be committed by accident.
#
# Image tags come from tools.lock.json. Do not edit here without also
# editing versions.env and tools.lock.json.

services:
  etcd:
    container_name: cc-lab-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    # Deliberately no `ports:` — etcd is only spoken to by Milvus over the
    # internal Docker network at `etcd:2379`. Wave 1 caught a Docker Desktop
    # host-port bind failure on 2379 (address reported as in use even when
    # lsof shows nothing); the simplest fix is to stop exposing the port at
    # all, which is also stricter under `no_default_egress` because there
    # is no host-visible listener to enumerate.
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: cc-lab-minio
    # Note: MinIO no longer publishes to Docker Hub's `minio/minio` namespace;
    # the canonical registry is quay.io. Wave 1 caught this — `docker pull
    # minio/minio` returns "pull access denied for minio/minio, repository
    # does not exist" even for `:latest`. The tag on quay.io matches the
    # pinned RELEASE stamp verbatim.
    image: quay.io/minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    # Deliberately no `ports:` — MinIO only serves Milvus, over the internal
    # Docker network at `minio:9000`. Same reasoning as etcd: nothing outside
    # the compose stack needs to touch MinIO, and not exposing it keeps the
    # `no_default_egress` probe honest (no host-visible listener).
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    container_name: cc-lab-milvus
    # v2.4.13 was the initial pin, but Wave 1 caught a BM25 sparse-index
    # incompatibility: `createHybridCollection` succeeds but loading the
    # collection then fails with `there is no vector index on field:
    # [sparse_vector]`. This is a known issue between older Milvus
    # sparse-vector support and @zilliz/milvus2-sdk-node@3.x, which does
    # not send a sparse-index spec that 2.4 accepts. v2.5.x is where
    # sparse-vector (BM25 hybrid) support stabilises to the shape the
    # SDK expects — the collection now loads on first attempt.
    image: milvusdb/milvus:v2.5.20
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      - "etcd"
      - "minio"

networks:
  default:
    name: cc-lab-milvus
