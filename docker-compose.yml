# Local Milvus (standalone) stack for the fully-local claude-context path.
#
# This mirrors the "standalone Docker Compose" recipe milvus-io publishes
# at https://github.com/milvus-io/milvus/blob/master/deployments/docker/standalone/docker-compose.yml
# with two deliberate changes:
#
#   1. All three services (etcd, minio, milvus-standalone) bind to
#      127.0.0.1 only, so the lab's `no_default_egress` probe with `lsof`
#      cannot pick up an accidental LAN listener that would tip the
#      shared-instance cell in the wrong direction.
#
#   2. Volumes bind-mount into ./volumes/ under the PoC repo, so an
#      operator can inspect the on-disk index shape for the
#      `vector_store_local` and `portable_index` probes without hunting
#      through named Docker volumes. The .gitignore drops ./volumes/
#      so this state cannot be committed by accident.
#
# Image tags come from tools.lock.json. Do not edit here without also
# editing versions.env and tools.lock.json.

services:
  etcd:
    container_name: cc-lab-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    ports:
      - "127.0.0.1:2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: cc-lab-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:9000:9000"
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    container_name: cc-lab-milvus
    image: milvusdb/milvus:v2.4.13
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      - "etcd"
      - "minio"

networks:
  default:
    name: cc-lab-milvus
